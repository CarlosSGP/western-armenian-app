<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Parev · Western Armenian</title>
<style>
:root{--bg:#f4ecdf;--card:#fffaf1;--ink:#2a2019;--mute:#7d6d5c;--line:#e0d2bc;--acc:#a3233b;--acc2:#d9792b;--ok:#2f7d55;--okbg:#e1f1e6;--no:#b3261e;--nobg:#fbe4e0;--hy:"Noto Sans Armenian","Mshtakan","Segoe UI",system-ui,sans-serif}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
button{font:inherit;color:inherit;cursor:pointer}
.hy{font-family:var(--hy)}
#app{max-width:820px;margin:0 auto;padding:0 20px 120px}
header{display:flex;align-items:center;gap:16px;flex-wrap:wrap;padding:22px 0 14px;border-bottom:2px solid var(--ink)}
.brand{font-family:var(--hy);font-size:26px;font-weight:700;color:var(--acc);margin-right:auto;line-height:1}
.brand small{display:block;font:500 12px system-ui;color:var(--mute);letter-spacing:.12em;text-transform:uppercase;margin-top:6px}
nav{display:flex;gap:4px;flex-wrap:wrap}
nav button{background:none;border:0;padding:8px 12px;border-radius:8px;font-weight:600;color:var(--mute)}
nav button.on{background:var(--ink);color:var(--bg)}
nav button .n{background:var(--acc);color:#fff;border-radius:10px;padding:1px 7px;font-size:12px;margin-left:6px}
.stats{display:flex;gap:28px;padding:18px 0;color:var(--mute);font-size:14px}
.stats b{display:block;font-size:24px;color:var(--ink);line-height:1.1}
.unit{margin-top:26px}
.unit h2{margin:0;font-size:20px}
.unit p{margin:2px 0 12px;color:var(--mute);font-size:14px}
.unit .k{color:var(--acc2);font-weight:700;font-size:12px;letter-spacing:.14em;text-transform:uppercase}
.lessons{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.lesson{text-align:left;background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;gap:12px;align-items:center}
.lesson:hover:not(:disabled){border-color:var(--acc)}
.lesson:disabled{opacity:.45;cursor:not-allowed}
.lesson .dot{width:30px;height:30px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-size:13px;font-weight:700;flex:none}
.lesson.done .dot{background:var(--ok);border-color:var(--ok);color:#fff}
.lesson.next .dot{border-color:var(--acc);color:var(--acc)}
.lesson span{font-weight:600;font-size:15px;line-height:1.25}
.btn{border:1.5px solid var(--ink);background:none;border-radius:10px;padding:11px 22px;font-weight:700}
.btn.primary{background:var(--acc);border-color:var(--acc);color:#fff}
.btn:disabled{opacity:.35;cursor:not-allowed}
.btn.small{padding:6px 12px;font-size:14px}
.extop{display:flex;align-items:center;gap:14px;padding:22px 0}
.x{border:0;background:none;font-size:14px;font-weight:600;color:var(--mute);white-space:nowrap;padding:6px 4px}
.x:disabled{opacity:.3;cursor:default}
.bar{flex:1;height:10px;background:var(--line);border-radius:5px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--acc2);transition:width .3s}
.ex{min-height:340px;padding-top:8px}
.q{font-size:14px;font-weight:700;color:var(--mute);text-transform:uppercase;letter-spacing:.08em;margin:0 0 16px}
.big{font-family:var(--hy);font-size:44px;line-height:1.25;margin:0;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.big.xl{font-size:96px;color:var(--acc)}
.tr{color:var(--mute);font-style:italic}
.text{font-size:26px;font-weight:600;margin:0}
.spk{border:1.5px solid var(--line);background:var(--card);border-radius:50%;width:40px;height:40px;font-size:17px;flex:none}
.opts{display:grid;gap:10px;margin-top:24px}
.opt{text-align:left;background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:13px 16px;display:flex;gap:12px;align-items:baseline}
.opt .num{color:var(--mute);font-size:12px;font-weight:700}
.opt.hy b{font-family:var(--hy);font-size:24px;font-weight:500}
.opt small{color:var(--mute)}
.opt.sel{border-color:var(--acc);background:#fbeef0}
.opt.right{border-color:var(--ok);background:var(--okbg)}
.card{background:var(--card);border:1.5px solid var(--line);border-radius:16px;padding:28px}
.card .en{font-size:22px;font-weight:600;margin:10px 0 0}
.tip{background:var(--card);border-left:4px solid var(--acc2);border-radius:0 12px 12px 0;padding:6px 22px}
.tip table{border-collapse:collapse;margin:8px 0}
.tip td{padding:3px 16px 3px 0;font-family:var(--hy)}
.tip .hy{font-size:1.1em}
.ansrow{min-height:64px;border-bottom:2px solid var(--line);padding:8px 0;margin:22px 0 18px;display:flex;flex-wrap:wrap;gap:8px}
.bank{display:flex;flex-wrap:wrap;gap:8px}
.tile{background:var(--card);border:1.5px solid var(--line);border-bottom-width:3px;border-radius:10px;padding:8px 14px;font-size:17px}
.tile.hy{font-family:var(--hy);font-size:21px}
.tile.used{visibility:hidden}
.match{display:grid;grid-template-columns:1fr 1fr;gap:10px 18px;margin-top:20px}
.match button{background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:12px;font-size:17px}
.match .hy{font-size:22px}
.match .sel{border-color:var(--acc);background:#fbeef0}
.match .gone{opacity:.3;border-color:var(--ok);pointer-events:none}
.match .bad{border-color:var(--no);background:var(--nobg)}
.inp{width:100%;font-family:var(--hy);font-size:28px;padding:12px 14px;border:1.5px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);margin:20px 0 12px}
.kb{display:grid;grid-template-columns:repeat(10,1fr);gap:5px}
.kb button{font-family:var(--hy);font-size:20px;padding:7px 0;background:var(--card);border:1.5px solid var(--line);border-radius:8px}
.kb .wide{grid-column:span 3;font:600 14px system-ui}
canvas.trace{width:100%;max-width:560px;aspect-ratio:560/300;background:var(--card);border:1.5px dashed var(--line);border-radius:16px;touch-action:none;display:block;margin:14px 0}
.foot{position:fixed;left:0;right:0;bottom:0;background:var(--bg);border-top:1.5px solid var(--line)}
.foot>div{max-width:820px;margin:0 auto;padding:14px 20px;display:flex;gap:14px;align-items:center;justify-content:flex-end}
.fb{margin-right:auto;font-size:15px}
.fb b{display:block;font-size:17px}
.fb.ok b{color:var(--ok)}.fb.no b{color:var(--no)}
.fb .hy{font-size:19px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(78px,1fr));gap:8px;margin:16px 0}
.grid button{background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:8px 4px;font-family:var(--hy);font-size:24px}
.grid button small{display:block;font:600 12px system-ui;color:var(--mute)}
.grid button.on{border-color:var(--acc)}
h1{font-size:26px;margin:26px 0 6px}
h3{margin:26px 0 8px}
.row{display:flex;gap:12px;align-items:center;justify-content:space-between;padding:14px 0;border-bottom:1px solid var(--line)}
.row small{display:block;color:var(--mute)}
.center{text-align:center;padding:60px 0}
.center .big{justify-content:center}
.gh{font:inherit;padding:7px 10px;border:1.5px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink);min-width:200px}
.note{color:var(--mute);font-size:14px}
</style>
</head>
<body>
<div id="app"></div>
<script>
// Western Armenian curriculum. Classical (Mashtotsian) orthography, Western pronunciation.
// ALPHABET: [upper, lower, letter name, sound, hint, example, example romanized, example meaning]
const ALPHABET = [
["Ա","ա","ayp","a","a as in father","արեւ","arev","sun"],
["Բ","բ","pen","p","p as in pen","բարեւ","parev","hello"],
["Գ","գ","kim","k","k as in kite","գիրք","kirk","book"],
["Դ","դ","ta","t","t as in top","դուռ","tour","door"],
["Ե","ե","yech","ye · e","ye at the start of a word, e (as in bed) inside","երեք","yerek","three"],
["Զ","զ","za","z","z as in zoo","զանգ","zank","bell"],
["Է","է","e","e","e as in bed","էջ","ech","page"],
["Ը","ը","ət","ə","uh, like the a in about","ընկեր","ənger","friend"],
["Թ","թ","to","t","t as in top","թէյ","tey","tea"],
["Ժ","ժ","zhe","zh","like the s in measure","ժամ","zham","hour"],
["Ի","ի","ini","i","ee as in see","ինչ","inch","what"],
["Լ","լ","lyoun","l","l as in lamp","լաւ","lav","good"],
["Խ","խ","khe","kh","like ch in Bach","խնձոր","khntsor","apple"],
["Ծ","ծ","dza","dz","like ds in adds","ծով","dzov","sea"],
["Կ","կ","gen","g","g as in go","կատու","gadou","cat"],
["Հ","հ","ho","h","h as in hat","հաց","hats","bread"],
["Ձ","ձ","tsa","ts","ts as in cats","ձուկ","tsoug","fish"],
["Ղ","ղ","ghad","gh","a gargled r, like French r","աղ","agh","salt"],
["Ճ","ճ","je","j","j as in jam","ճաշ","jash","meal"],
["Մ","մ","men","m","m as in map","մայր","mayr","mother"],
["Յ","յ","hi","h · y","h at the start of a word, y inside, usually silent at the end","յոյս","houys","hope"],
["Ն","ն","nou","n","n as in net","նոր","nor","new"],
["Շ","շ","sha","sh","sh as in ship","շուն","shoun","dog"],
["Ո","ո","vo","vo · o","vo at the start of a word, o inside","ոչ","voch","no"],
["Չ","չ","cha","ch","ch as in chair","չորս","chors","four"],
["Պ","պ","be","b","b as in boy","պզտիկ","bzdig","small"],
["Ջ","ջ","che","ch","ch as in chair","ջուր","chour","water"],
["Ռ","ռ","ra","rr","a rolled r","առաւօտ","aravod","morning"],
["Ս","ս","se","s","s as in sun","սէր","ser","love"],
["Վ","վ","vev","v","v as in van","վարդ","vart","rose"],
["Տ","տ","dyoun","d","d as in dog","տուն","doun","house"],
["Ր","ր","re","r","a soft, tapped r","րոպէ","robe","minute"],
["Ց","ց","tso","ts","ts as in cats","ցուրտ","tsourd","cold"],
["Ւ","ւ","hyoun","v","v; it also builds ու, իւ and եւ","նաւ","nav","ship"],
["Փ","փ","pyour","p","p as in pen","փողոց","poghots","street"],
["Ք","ք","ke","k","k as in kite","քաղաք","kaghak","city"],
["Օ","օ","o","o","o as in more","օր","or","day"],
["Ֆ","ֆ","fe","f","f as in fun","ֆիլմ","film","film"],
// letter combinations
["Ու","ու","","ou","oo as in moon","ուրախ","ourakh","happy"],
["Եւ","եւ","","yev · ev","yev on its own (it means 'and'), ev inside a word","եւ","yev","and"],
["Իւ","իւ","","you","like the word 'you' (or French u)","ձիւն","tsyoun","snow"],
["Եա","եա","","ya","ya as in yard","սենեակ","senyag","room"],
["Ոյ","ոյ","","ouy","oo + y, like 'gooey' said quickly","լոյս","louys","light"]
];

const P = s => s.trim().split("\n").map(l => { const [hy, tr, en] = l.trim().split("|"); return { hy: hy.replace(/'/g, "՚"), tr, en }; });
const L = (title, words, sentences, tip) => ({ title, words: P(words), sentences: P(sentences), tip });
const A = (title, letters, tip) => ({ title, letters, tip });

const UNITS = [
{ title: "The Alphabet", desc: "All 38 letters, the Western way", lessons: [
A("Letters 1: Ա to Զ", [0,1,2,3,4,5], `<p>Armenian has 38 letters and is written left to right. Each letter has a capital and a small form.</p><p><b>The Western shift.</b> Western Armenian pronounces several consonants differently from Eastern Armenian. In this course <b>Բ = p</b>, <b>Գ = k</b>, <b>Դ = t</b>. Trust the sounds taught here, not what an Eastern chart says.</p>`),
A("Letters 2: Է to Լ", [6,7,8,9,10,11], `<p><b>Է</b> and <b>Ե</b> both sound like e, but Ե at the start of a word says <i>ye</i>.</p><p><b>Ը</b> is the short "uh". Armenian often says this sound between consonants without writing it: <span class="hy">պզտիկ</span> is read <i>bzdig</i> with tiny "uh" sounds helping it along.</p>`),
A("Letters 3: Խ to Ղ", [12,13,14,15,16,17], `<p>More of the Western shift: <b>Կ = g</b>, <b>Ծ = dz</b>, <b>Ձ = ts</b>.</p><p><b>Խ</b> (kh) is raspy, made at the back of the mouth. <b>Ղ</b> (gh) is the same place but voiced, like a gargle.</p>`),
A("Letters 4: Ճ to Շ", [18,19,20,21,22], `<p><b>Ճ = j</b> in Western Armenian.</p><p><b>Յ</b> changes by position: <i>h</i> at the start (<span class="hy">յոյս</span> houys), <i>y</i> in the middle (<span class="hy">մայր</span> mayr), and usually silent at the end (<span class="hy">տղայ</span> dgha).</p>`),
A("Letters 5: Ո to Ս", [23,24,25,26,27,28], `<p><b>Պ = b</b> and <b>Ջ = ch</b> in Western Armenian.</p><p><b>Ո</b> says <i>vo</i> at the start of a word and <i>o</i> elsewhere. <b>Ռ</b> is a strong rolled r.</p>`),
A("Letters 6: Վ to Ւ", [29,30,31,32,33], `<p><b>Տ = d</b> in Western Armenian.</p><p><b>Ր</b> is a light tapped r. <b>Ւ</b> is rarely alone: it mostly appears in the pairs you will meet in the last alphabet lesson.</p>`),
A("Letters 7: Փ to Ֆ", [34,35,36,37], `<p><b>Փ</b>, <b>Ք</b> are p and k. So Western Armenian has pairs that sound alike: Բ/Փ (p), Գ/Ք (k), Դ/Թ (t), Ձ/Ց (ts), Ջ/Չ (ch). Spelling them correctly is a matter of memory, like English "c" and "k".</p><p><b>Օ</b> is o. <b>Ֆ</b> is f and appears mostly in borrowed words.</p>`),
A("Letter pairs: ու, եւ, իւ, եա, ոյ", [38,39,40,41,42], `<p>Some sounds are written with two letters. <b>ու</b> is the vowel "oo". <b>իւ</b> sounds like "you". <b>եա</b> is "ya". <b>ոյ</b> is "ooy". <b>եւ</b> is "yev" as a word and "ev" inside one.</p><p>Punctuation: the full stop is <b>։</b> and the question mark <b>՞</b> sits on top of the stressed vowel of the word being asked about: <span class="hy">ի՞նչ</span> "what?"</p>`)
]},

{ title: "Greetings", desc: "Hello, thank you, goodbye", lessons: [
L("Hello", `
բարեւ|parev|hello
այո|ayo|yes
ոչ|voch|no
հաճիս|hajis|please
շնորհակալութիւն|shnorhagaloutyoun|thank you
ներողութիւն|neroghoutyoun|sorry
լաւ|lav|good
ինչպէս|inchbes|how`, `
Բարեւ, ինչպէ՞ս ես։|Parev, inchbes es?|Hello, how are you?
Լաւ եմ, շնորհակալութիւն։|Lav em, shnorhagaloutyoun.|I am well, thank you.
Այո, հաճիս։|Ayo, hajis.|Yes, please.
Ոչ, շնորհակալութիւն։|Voch, shnorhagaloutyoun.|No, thank you.`,
`<p><span class="hy">շնորհակալութիւն</span> is the full "thank you". In everyday speech Western Armenians also say <span class="hy">մերսի</span> (<i>mersi</i>).</p><p><span class="hy">ինչպէ՞ս ես</span> is "how are you?" to one person you know well.</p>`),
L("Through the day", `
բարի լոյս|pari louys|good morning
բարի իրիկուն|pari irigoun|good evening
գիշեր բարի|kisher pari|good night
ցտեսութիւն|tsdesoutyoun|goodbye
մնաք բարով|mnak parov|goodbye (said by the one leaving)
երթաք բարով|yertak parov|goodbye (said to the one leaving)
խնդրեմ|khntrem|you are welcome / please
շատ|shad|very`, `
Բարի լոյս, ինչպէ՞ս էք։|Pari louys, inchbes ek?|Good morning, how are you?
Շատ լաւ եմ։|Shad lav em.|I am very well.
Գիշեր բարի, ցտեսութիւն։|Kisher pari, tsdesoutyoun.|Good night, goodbye.
Շատ շնորհակալ եմ։|Shad shnorhagal em.|Thank you very much.`,
`<p><span class="hy">բարի լոյս</span> literally means "good light".</p><p>There are two goodbyes: the person leaving says <span class="hy">մնաք բարով</span> ("stay well") and the person staying answers <span class="hy">երթաք բարով</span> ("go well"). To one friend, say <span class="hy">մնաս բարով</span> and <span class="hy">երթաս բարով</span>.</p><p><span class="hy">խնդրեմ</span> answers a thank-you and also means "please" or "here you go". Another reply to thanks is <span class="hy">չ՚արժեր</span> (<i>charzher</i>, "it's nothing").</p><p><span class="hy">ինչպէ՞ս էք</span> is the polite or plural "how are you?"</p>`),
L("Names", `
անուն|anoun|name
ինչ|inch|what
ես|yes|I
դուն|toun|you (one person, informal)
դուք|touk|you (polite or plural)
ուրախ|ourakh|happy
ալ|al|also
հայ|hay|Armenian (person)`, `
Անունդ ի՞նչ է։|Anount inch e?|What is your name?
Անունս Արամ է։|Anouns Aram e.|My name is Aram.
Ես հայ եմ։|Yes hay em.|I am Armenian.
Դուն հա՞յ ես։|Toun hay es?|Are you Armenian?
Ես ալ լաւ եմ։|Yes al lav em.|I am fine too.
Ուրախ եմ։|Ourakh em.|I am glad.`,
`<p>Add <b>-ս</b> to a noun for "my" and <b>-դ</b> for "your": <span class="hy">անունս</span> my name, <span class="hy">անունդ</span> your name.</p><p>Careful: <span class="hy">ես</span> is both "I" (read <i>yes</i>) and "you are" (read <i>es</i>, after another word).</p>`)
]},

{ title: "People", desc: "To be, family, my and your", lessons: [
L("I am, you are", `
ան|an|he / she
մենք|menk|we
անոնք|anonk|they
հոս|hos|here
հոն|hon|there
ուսանող|ousanogh|student
ուսուցիչ|ousoutsich|teacher
բժիշկ|pzhishg|doctor`, `
Ան ուսուցիչ է։|An ousoutsich e.|She is a teacher.
Մենք հոս ենք։|Menk hos enk.|We are here.
Անոնք հոն են։|Anonk hon en.|They are there.
Դուք բժի՞շկ էք։|Touk pzhishg ek?|Are you a doctor?
Ես ուսանող եմ։|Yes ousanogh em.|I am a student.`,
`<p><b>To be</b> comes after the word it describes:</p><table><tr><td>ես … <b>եմ</b></td><td>I am</td><td>մենք … <b>ենք</b></td><td>we are</td></tr><tr><td>դուն … <b>ես</b></td><td>you are</td><td>դուք … <b>էք</b></td><td>you are</td></tr><tr><td>ան … <b>է</b></td><td>he/she is</td><td>անոնք … <b>են</b></td><td>they are</td></tr></table><p>Armenian has no grammatical gender: <span class="hy">ան</span> is he, she and it.</p>`),
L("I am not", `
չեմ|chem|I am not
չէ|che|is not
բայց|payts|but
եւ|yev|and
կամ|gam|or
հիմա|hima|now`, `
Ես բժիշկ չեմ։|Yes pzhishg chem.|I am not a doctor.
Ան հոս չէ։|An hos che.|He is not here.
Հիմա հոս չեմ։|Hima hos chem.|I am not here now.
Ան ուսուցիչ է, բայց ես ուսանող եմ։|An ousoutsich e, payts yes ousanogh em.|She is a teacher but I am a student.

  const it = items[stIdx], mine = LOCAL.has(it.id), nDone = items.filter(x => LOCAL.has(x.id)).length;
  const status = h('p', { class: 'note' }, mine ? 'Recorded in this browser.' : MANIFEST[it.id] ? 'A published clip exists. Recording here replaces it in this browser.' : 'Not recorded yet.');
  const go = d => { stIdx += d; studio(); };
  let r = null, ch = [];
  const recB = h('button', { class: 'btn primary', id: 'go', onclick: async () => {
    if (r && r.state === 'recording') { r.stop(); return; }
    try {
      const st = await navigator.mediaDevices.getUserMedia({ audio: true });
      r = new MediaRecorder(st); ch = [];
      r.ondataavailable = e => ch.push(e.data);
      r.onstop = async () => { st.getTracks().forEach(t => t.stop()); await idbReq('readwrite', o => o.put(new Blob(ch, { type: r.mimeType || 'audio/webm' }), it.id)); LOCAL.add(it.id); studio(); say(it.hy); };
      r.start(); recB.textContent = '■ Stop';
    } catch (e) { status.textContent = 'Microphone unavailable. Use the hosted page (not a downloaded file) and allow microphone access.'; }
  } }, mine ? '● Record again' : '● Record');
  const file = h('input', { type: 'file', accept: '.json', style: 'display:none', onchange: async e => {
    const f = e.target.files[0]; if (!f) return;
    try { const d = JSON.parse(await f.text()); for (const id in d) { const bin = atob(d[id].data), u = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i); await idbReq('readwrite', o => o.put(new Blob([u], { type: d[id].mime }), id)); LOCAL.add(id); } } catch (err) {}
    studio();
  } });
  const exportAll = async () => {
    const out = {};
    for (const x of items) { if (!LOCAL.has(x.id)) continue; const b = await idbReq('readonly', o => o.get(x.id)); if (b) out[x.id] = { hy: x.hy, mime: b.type, data: await blobB64(b) }; }
    const a = h('a', { href: URL.createObjectURL(new Blob([JSON.stringify(out)], { type: 'application/json' })), download: 'parev-recordings.json' }); document.body.append(a); a.click(); a.remove();
  };
  app.append(topBar('set'), h('h1', {}, 'Recording studio'),
    h('p', {}, 'For a Western Armenian speaker to give the course a voice. Read each item once, clearly, at a natural pace. Recordings are stored in this browser and play everywhere in the course straight away.'),
    h('p', { class: 'note' }, `${nDone} of ${items.length} recorded · item ${stIdx + 1}`),
    h('div', { class: 'card' }, h('p', { class: 'big' }, it.hy, hasClip(it.hy) ? spk(it.hy) : null), h('div', { class: 'tr' }, it.tr), h('p', { class: 'en' }, it.en), status),
    h('p', { style: 'display:flex;gap:10px;flex-wrap:wrap;margin-top:16px' }, recB,
      h('button', { class: 'btn', disabled: stIdx === 0, onclick: () => go(-1) }, '← Back'),
      h('button', { class: 'btn', disabled: stIdx >= items.length - 1, onclick: () => go(1) }, 'Next →'),
      h('button', { class: 'btn', onclick: () => { const n = items.findIndex((x, i) => i > stIdx && !LOCAL.has(x.id)); if (n >= 0) { stIdx = n; studio(); } } }, 'Next unrecorded'),
      mine ? h('button', { class: 'btn', onclick: async () => { await idbReq('readwrite', o => o.delete(it.id)); LOCAL.delete(it.id); studio(); } }, 'Delete') : null),
    h('h3', {}, 'Moving recordings'),
    h('p', { class: 'note' }, 'Export saves every recording made in this browser as one file. Import loads such a file into another browser. To publish the clips for everyone who uses the course, the file is unpacked into the audio folder of the repository (see the README); only do that with the speaker\'s consent, since their voice becomes public.'),
    h('p', { style: 'display:flex;gap:10px' }, h('button', { class: 'btn small', disabled: !nDone, onclick: exportAll }, 'Export recordings'), h('button', { class: 'btn small', onclick: () => file.click() }, 'Import recordings'), file,
      h('button', { class: 'btn small', onclick: settings }, 'Back to settings')));
}
function ghRow() {
  const g = GH() || {};
  const repo = h('input', { class: 'gh', placeholder: 'username/repository', value: g.repo || '' });
  const tok = h('input', { class: 'gh', type: 'password', placeholder: 'access token', value: g.token || '' });
  const msg = h('small', {}, ghMsg || (g.repo ? 'Connected to ' + g.repo : 'Not connected'));
  const go = async () => {
    if (repo.value.trim() && tok.value.trim()) { repo.value = repo.value.trim().replace(/^https?:\/\/github\.com\//i, '').replace(/\.git$/i, '').replace(/^\/+|\/+$/g, ''); localStorage.setItem('parev.gh', JSON.stringify({ repo: repo.value, token: tok.value.trim() })); }
    else { localStorage.removeItem('parev.gh'); setDirty(false); msg.textContent = 'Not connected'; return; }
    setDirty(false); msg.textContent = 'Syncing…'; await ghSync(); msg.textContent = ghMsg;
  };
  return h('div', { class: 'row' }, h('div', {}, h('b', {}, 'Sync progress to GitHub'),
    h('small', {}, 'Your private repository becomes the home of your progress: the app loads progress.json from it every time it opens and saves to it after every lesson. When you first connect, progress already in the repository replaces what is on this device. Needs a fine-grained access token with read and write access to Contents on that one repository. The token is kept only in this browser.'),
    h('div', { style: 'display:flex;gap:8px;margin-top:8px;flex-wrap:wrap' }, repo, tok), msg),
    h('button', { class: 'btn small', onclick: go }, 'Save & sync'));
}
document.addEventListener('keydown', e => {
  const typing = e.target && e.target.tagName === 'INPUT';
  if (e.key === 'Enter') { const g = $('#go'); if (g && !g.disabled) { e.preventDefault(); g.click(); } }
  else if (!typing && /^[1-4]$/.test(e.key)) { const o = document.querySelectorAll('.opt')[+e.key - 1]; if (o) o.click(); }
});
audioInit();
if (GH()) {
  $('#app').append(h('div', { class: 'center' }, h('p', { class: 'big' }, 'Բարեւ'), h('p', { class: 'note' }, 'Loading your progress from GitHub…')));
  Promise.race([ghSync(), new Promise(r => setTimeout(r, 8000))]).then(() => { if (!ghMsg) ghMsg = 'GitHub is slow to answer; showing the copy on this device for now.'; if (!sess) home(); });
} else home();
</script>
</body>
</html>
